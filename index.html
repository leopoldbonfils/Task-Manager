<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZenTask — Premium Task Manager</title>
  <!-- Google Fonts: Inter for clean typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Stylesheet -->
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>

  <div class="app-container">
    <!-- Simple Header -->
    <header class="app-header">
      <h1>Task Manager</h1>
    </header>

    <!-- Main Content Card -->
    <main class="main-card">
      <!-- Input Section -->
      <div class="input-section">
        <div class="input-wrapper">
          <input type="text" id="taskNameInput" placeholder=" add task here?" autocomplete="off">
        </div>
        <button id="addBtn" class="btn-primary">
          <span>Add Task</span>
        </button>
      </div>

      <!-- Filters Toolbar -->
      <div class="toolbar">
        <div class="filter-tabs">
          <button class="filter-tab active" data-filter="all">All</button>
          <button class="filter-tab" data-filter="pending">Pending</button>
          <button class="filter-tab" data-filter="completed">Completed</button>
        </div>
        <button id="clearCompletedBtn" class="btn-secondary" title="Clear all completed tasks">
          Clear Completed
        </button>
      </div>

      <!-- Tasks List Area -->
      <div id="taskList" class="task-list">
        <!-- Rendered dynamically -->
      </div>

      <!-- Empty state placeholder -->
      <div id="emptyMessage" class="empty-state">
        <div class="empty-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10" />
            <path d="m15 9-6 6" />
            <path d="m9 9 6 6" />
          </svg>
        </div>
        <h3>No tasks found</h3>
        <p>Try adding a task above or select a different filter.</p>
      </div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <p>ZenTask</p>
    </footer>
  </div>

  <!-- Vite entrypoint module -->
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
